name: Build E404 Kernel (Droidspaces)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-arm-linux-gnueabi gcc-arm-linux-gnueabi \
            libncurses-dev libssl-dev python3 rsync \
            unzip wget zip lz4 xz-utils zstd

      - name: Setup Neutron Clang (AntMan)
        run: |
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S
          echo "$HOME/toolchains/neutron-clang/bin" >> $GITHUB_PATH
          echo "=== Clang version ==="
          "$HOME/toolchains/neutron-clang/bin/clang" --version | head -2

      - name: Clone E404 kernel source
        run: |
          git clone --depth=1 --single-branch -b staging-bpf --recurse-submodules --shallow-submodules \
            https://github.com/kvsnr113/xiaomi_sm8250_kernel_e404.git kernel

      - name: Apply Droidspaces source patches
        working-directory: kernel
        run: |
          for p in ../patches/*.patch; do
            echo "=== Applying $p ==="
            git apply --check "$p" && git apply "$p" && echo "OK: $p" || { echo "FAILED: $p"; exit 1; }
          done
          echo "=== All patches applied ==="

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Generate base config
        working-directory: kernel
        run: |
          make -j$(nproc) O=out \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 \
            vendor/alioth_defconfig

      - name: Merge Droidspaces config fragment
        working-directory: kernel
        run: |
          export ARCH=arm64

          # Merge fragment into the generated config
          cd out
          ../scripts/kconfig/merge_config.sh -m .config ../../droidspaces.config

          # Resolve dependencies to produce a valid final config
          cd ..
          make -j$(nproc) O=out \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

          CONFIG="out/.config"

          check_cfg() {
            local want="$1"   # e.g. CONFIG_X=y or CONFIG_X=n
            local key="${want%%=*}"
            local val="${want##*=}"
            if [ "$val" = "y" ]; then
              if grep -q "^${key}=y" "$CONFIG"; then
                echo "  ✅ $key=y"
              else
                echo "  ❌ $key != y"; FAIL=1
              fi
            else  # =n
              if grep -q "^${key}=n" "$CONFIG" || grep -q "^# ${key} is not set" "$CONFIG"; then
                echo "  ✅ $key=n (or not set)"
              else
                echo "  ❌ $key is enabled"; FAIL=1
              fi
            fi
          }

          echo "=== Verifying Droidspaces configs ==="
          FAIL=0
          check_cfg CONFIG_ANDROID_PARANOID_NETWORK=n
          check_cfg CONFIG_CGROUP_DEVICE=y
          check_cfg CONFIG_USER_NS=y
          check_cfg CONFIG_UTS_NS=y
          check_cfg CONFIG_IPC_NS=y
          check_cfg CONFIG_PID_NS=y
          check_cfg CONFIG_NET_NS=y
          check_cfg CONFIG_POSIX_MQUEUE=y
          check_cfg CONFIG_CGROUP_PIDS=y
          check_cfg CONFIG_MEMCG=y
          check_cfg CONFIG_FAIR_GROUP_SCHED=y
          check_cfg CONFIG_OVERLAY_FS=y
          check_cfg CONFIG_TMPFS_POSIX_ACL=y
          check_cfg CONFIG_TMPFS_XATTR=y
          check_cfg CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          check_cfg CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          check_cfg CONFIG_IP_SET=y
          check_cfg CONFIG_NAMESPACES=y
          check_cfg CONFIG_CGROUPS=y
          check_cfg CONFIG_SECCOMP=y
          check_cfg CONFIG_VETH=y
          check_cfg CONFIG_BRIDGE=y
          check_cfg CONFIG_DEVTMPFS=y

          if [ "$FAIL" -eq 1 ]; then
            echo "=== WARNING: Some configs not enabled (missing Kconfig deps) ==="
          else
            echo "=== All Droidspaces configs verified ==="
          fi

      - name: Build kernel
        working-directory: kernel
        run: |
          make -j$(nproc) O=out \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 2>&1 | tee ../build.log

          echo "=== Build complete ==="
          ls -la out/arch/arm64/boot/

      - name: Package kernel
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          DATE=$(date +%Y%m%d-%H%M)
          ZIP_NAME="E404-DroidSpaces-alioth-${VERSION}-${DATE}.zip"
          chmod +x scripts/package_anykernel.sh
          bash scripts/package_anykernel.sh kernel AnyKernel3 "$ZIP_NAME"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: E404-DroidSpaces-alioth
          path: E404-DroidSpaces-alioth-*.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/**/*.zip
          generate_release_notes: true
