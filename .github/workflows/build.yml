name: Build E404 Kernel (Droidspaces)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device (alioth, apollo, cas, cmi, elish, enuma, lmi, munch, pipa, thyme, umi)'
        required: false
        default: 'all'

env:
  E404_REPO: https://github.com/kvsnr113/xiaomi_sm8250_kernel_e404.git
  E404_BRANCH: staging-bpf
  CLANG_REPO: https://github.com/nicman23/neutron-clang.git
  AnyKernel_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        device:
          - alioth
          - apollo
          - cas
          - cmi
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - thyme
          - umi

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          echo "=== After cleanup ==="
          df -h /

      - name: Clone E404 kernel source
        run: |
          git clone --depth=1 --single-branch -b ${{ env.E404_BRANCH }} \
            ${{ env.E404_REPO }} kernel

      - name: Apply Droidspaces config fixes
        run: |
          chmod +x patches/droidspaces-defconfig-fix.sh
          bash patches/droidspaces-defconfig-fix.sh kernel/arch/arm64/configs/vendor

      - name: Verify critical configs
        run: |
          echo "=== Verifying Droidspaces configs in ${{ matrix.device }}_defconfig ==="
          DEFCONFIG="kernel/arch/arm64/configs/vendor/${{ matrix.device }}_defconfig"

          REQUIRED=(
            "CONFIG_ANDROID_PARANOID_NETWORK=n"
            "CONFIG_CGROUP_DEVICE=y"
            "CONFIG_USER_NS=y"
            "CONFIG_POSIX_MQUEUE=y"
            "CONFIG_NAMESPACES=y"
            "CONFIG_PID_NS=y"
            "CONFIG_UTS_NS=y"
            "CONFIG_IPC_NS=y"
            "CONFIG_NET_NS=y"
            "CONFIG_SECCOMP=y"
            "CONFIG_CGROUPS=y"
            "CONFIG_DEVTMPFS=y"
            "CONFIG_VETH=y"
            "CONFIG_BRIDGE=y"
            "CONFIG_OVERLAY_FS=y"
            "CONFIG_MEMCG=y"
            "CONFIG_CGROUP_PIDS=y"
            "CONFIG_FAIR_GROUP_SCHED=y"
            "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y"
            "CONFIG_TMPFS_POSIX_ACL=y"
            "CONFIG_TMPFS_XATTR=y"
          )

          FAIL=0
          for cfg in "${REQUIRED[@]}"; do
            KEY=$(echo "$cfg" | cut -d'=' -f1)
            VAL=$(echo "$cfg" | cut -d'=' -f2)
            if grep -q "^${cfg}" "$DEFCONFIG" 2>/dev/null; then
              echo "  ✅ $cfg"
            else
              echo "  ❌ MISSING: $cfg"
              FAIL=1
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "=== Some required configs are missing! ==="
            exit 1
          fi

          echo ""
          echo "=== All Droidspaces configs verified ==="

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-arm-linux-gnueabi gcc-arm-linux-gnueabi \
            git libgnome2-0 libncurses5 libssl-dev \
            python3 python3-pip rsync unzip wget \
            zip lz4 xz-utils

          # Install binfmt support for cross-compilation
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Clone Clang toolchain
        run: |
          git clone --depth=1 ${{ env.CLANG_REPO }} toolchain/clang
          echo "Clang version:"
          toolchain/clang/bin/clang --version | head -2

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 ${{ env.AnyKernel_REPO }} AnyKernel3

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/toolchain/clang/bin:$PATH"
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1

          cd kernel

          echo "=== Building for ${{ matrix.device }} ==="

          make -j$(nproc) O=out \
            CC="ccache clang" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 \
            vendor/${{ matrix.device }}_defconfig 2>&1 | tail -5

          make -j$(nproc) O=out \
            CC="ccache clang" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-\
            LLVM=1 LLVM_IAS=1 2>&1 | tee ../build.log

          echo "=== Build complete ==="
          ls -la out/arch/arm64/boot/

      - name: Package kernel
        run: |
          cd kernel

          IMAGE="out/arch/arm64/boot/Image.gz-dtb"
          DTBO="out/arch/arm64/boot/dtbo.img"
          DTB="out/arch/arm64/boot/dtb"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image not found!"
            exit 1
          fi

          DEVICE="${{ matrix.device }}"
          VERSION=$(git describe --tags --always 2>/dev/null || echo "unknown")
          DATE=$(date +%Y%m%d-%H%M)
          ZIP_NAME="E404-DroidSpaces-${DEVICE}-${VERSION}-${DATE}.zip"

          cd ../AnyKernel3

          # Clean previous artifacts
          rm -f *.zip *.gz *.img
          rm -rf dtb

          # Copy kernel artifacts
          cp ../kernel/"$IMAGE" Image.gz-dtb
          cp ../kernel/"$DTBO" dtbo.img
          [ -d "../kernel/$DTB" ] && cp -r ../kernel/"$DTB" dtb/

          # Update anykernel.sh device
          sed -i "s/do.devicecheck=1/do.devicecheck=0/" anykernel.sh
          sed -i "/^device=/c\device=${DEVICE}" anykernel.sh

          # Create zip
          zip -r9 "../${ZIP_NAME}" . -x '*.git*'

          echo "=== Package created ==="
          ls -lh "../${ZIP_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: E404-DroidSpaces-${{ matrix.device }}
          path: E404-DroidSpaces-*.zip
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.device }}
          path: build.log
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: E404-DroidSpaces-*
          merge-multiple: true
          path: releases

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
