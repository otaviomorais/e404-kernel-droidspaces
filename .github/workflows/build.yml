name: Build E404 Kernel (Droidspaces)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Clone E404 kernel source
        run: |
          git clone --depth=1 --single-branch -b staging-bpf \
            https://github.com/kvsnr113/xiaomi_sm8250_kernel_e404.git kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-arm-linux-gnueabi gcc-arm-linux-gnueabi \
            libncurses5 libssl-dev python3 rsync \
            unzip wget zip lz4 xz-utils

      - name: Setup Neutron Clang toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -LO "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst"
          tar --zstd -xf neutron-clang-30072026.tar.zst
          mv clang neutron-clang
          rm -f neutron-clang-30072026.tar.zst
          echo "$(pwd)/neutron-clang/bin" >> $GITHUB_PATH
          export PATH="$(pwd)/neutron-clang/bin:$PATH"
          neutron-clang/bin/clang --version | head -2

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Generate base config
        working-directory: kernel
        run: |
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/neutron-clang/bin:$PATH"

          make -j$(nproc) O=out \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 \
            vendor/alioth_defconfig

          echo "=== Base .config generated ==="

      - name: Merge Droidspaces config fragment
        working-directory: kernel
        run: |
          scripts/kconfig/merge_config.sh -m .config ../droidspaces.config

          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/neutron-clang/bin:$PATH"

          make -j$(nproc) O=out \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

          echo "=== Droidspaces configs merged ==="

          echo "=== Verifying Droidspaces configs in .config ==="
          FAIL=0
          for cfg in \
            "CONFIG_ANDROID_PARANOID_NETWORK is not set" \
            "CONFIG_CGROUP_DEVICE=y" \
            "CONFIG_USER_NS=y" \
            "CONFIG_UTS_NS=y" \
            "CONFIG_IPC_NS=y" \
            "CONFIG_PID_NS=y" \
            "CONFIG_NET_NS=y" \
            "CONFIG_POSIX_MQUEUE=y" \
            "CONFIG_CGROUP_PIDS=y" \
            "CONFIG_MEMCG=y" \
            "CONFIG_FAIR_GROUP_SCHED=y" \
            "CONFIG_OVERLAY_FS=y" \
            "CONFIG_TMPFS_POSIX_ACL=y" \
            "CONFIG_TMPFS_XATTR=y" \
            "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" \
            "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y" \
            "CONFIG_IP_SET=y" \
            "CONFIG_NAMESPACES=y" \
            "CONFIG_CGROUPS=y" \
            "CONFIG_SECCOMP=y" \
            "CONFIG_VETH=y" \
            "CONFIG_BRIDGE=y" \
            "CONFIG_DEVTMPFS=y"; do
            if grep -q "^${cfg}" out/.config 2>/dev/null; then
              echo "  ✅ $cfg"
            else
              echo "  ❌ MISSING: $cfg"
              FAIL=1
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "=== WARNING: Some configs could not be enabled ==="
            echo "=== This may be due to missing Kconfig dependencies ==="
            echo "=== Continuing build anyway ==="
          else
            echo ""
            echo "=== All Droidspaces configs verified ==="
          fi

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/neutron-clang/bin:$PATH"

          make -j$(nproc) O=out \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 2>&1 | tee ../build.log

          echo "=== Build complete ==="
          ls -la out/arch/arm64/boot/

      - name: Package kernel
        run: |
          cd kernel

          IMAGE="out/arch/arm64/boot/Image.gz-dtb"
          DTBO="out/arch/arm64/boot/dtbo.img"
          DTB="out/arch/arm64/boot/dtb"

          if [ ! -f "$IMAGE" ]; then
            echo "Image.gz-dtb not found, checking alternatives..."
            for img in Image Image.gz Image.gz-dtb; do
              if [ -f "out/arch/arm64/boot/$img" ]; then
                IMAGE="out/arch/arm64/boot/$img"
                echo "Using: $IMAGE"
                break
              fi
            done
            if [ ! -f "$IMAGE" ]; then
              echo "ERROR: No kernel image found!"
              ls -la out/arch/arm64/boot/
              exit 1
            fi
          fi

          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          DATE=$(date +%Y%m%d-%H%M)
          ZIP_NAME="E404-DroidSpaces-alioth-${VERSION}-${DATE}.zip"

          cd ../AnyKernel3

          rm -f *.zip *.gz *.img
          rm -rf dtb ALIOTH-*

          cp ../kernel/"$IMAGE" ALIOTH-Image
          [ -f "../kernel/$DTBO" ] && cp "../kernel/$DTBO" ALIOTH-dtbo.img
          [ -d "../kernel/$DTB" ] && cp -r "../kernel/$DTB" dtb/

          sed -i "s/do.devicecheck=1/do.devicecheck=0/" anykernel.sh
          sed -i "/^device=/c\device=alioth" anykernel.sh

          zip -r9 "../${ZIP_NAME}" . -x '*.git*'

          echo "=== Package created ==="
          ls -lh "../${ZIP_NAME}"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: E404-DroidSpaces-alioth
          path: E404-DroidSpaces-alioth-*.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/**/*.zip
          generate_release_notes: true
